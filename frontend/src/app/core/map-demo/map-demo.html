<section class="container stack">
  <h1>Probna mapa</h1>

  <div class="actions">
    <button class="button" type="button" (click)="showChallenges()">Izazovi u gradu</button>
    <button class="button" type="button" (click)="showTour()">Tura</button>
    <button class="button" type="button" (click)="showEmpty()">Prazno</button>
    <button class="button button--primary" type="button" (click)="togglePath()">
      Uključi/isključi putanju
    </button>
  </div>

  <app-location-map
    [locations]="locations()"
    [showPath]="showPath()"
    (pathLengthChange)="pathLength.set($event)"
  />

  @if (showPath()) {
    <p>Dužina putanje: {{ pathLength().toFixed(2) }} km</p>
  }
</section>
