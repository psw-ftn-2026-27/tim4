<p class="proto-note">
  <a routerLink="/design-preview/prototype">← Prototipi</a>
  <span>Prototip · <strong>gost</strong> (nije prijavljen) · izmišljeni podaci</span>
</p>

<div class="proto-app">
  <header class="bar">
    <nav class="bar__inner" aria-label="Glavna navigacija">
      <a class="brand" [routerLink]="base">
        <span class="brand__mark" aria-hidden="true">◈</span> Explorer
      </a>

      <div class="sections">
        <a [routerLink]="base" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="active"
          >Kako funkcioniše</a
        >
      </div>

      <div class="mine">
        <a class="login" [routerLink]="base + '/login'" routerLinkActive="active">Prijava</a>
        <a class="button button--primary join" [routerLink]="base + '/register'">Registruj se</a>
      </div>
    </nav>
  </header>

  <main class="proto-main">
    <router-outlet />
  </main>
</div>
