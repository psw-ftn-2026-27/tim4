<p class="proto-note">
  <a routerLink="/design-preview/prototype">← Prototipi</a>
  <span>Prototip · <strong>turista</strong> (marko@explorer.dev) · izmišljeni podaci</span>
</p>

<div class="proto-app">
  <header class="bar">
    <nav class="bar__inner" aria-label="Glavna navigacija">
      <a class="brand" [routerLink]="base">
        <span class="brand__mark" aria-hidden="true">◈</span> Explorer
      </a>

      <div class="sections">
        <a [routerLink]="base + '/tours'" routerLinkActive="active">Ture</a>
        <a [routerLink]="base + '/challenges'" routerLinkActive="active">Izazovi</a>
        <a [routerLink]="base + '/journeys'" routerLinkActive="active">Moja putovanja</a>
        <a [routerLink]="base + '/studio'" routerLinkActive="active">Autorski studio</a>
      </div>

      <div class="mine">
        <a
          class="icon-link"
          [routerLink]="base + '/cart'"
          routerLinkActive="active"
          aria-label="Korpa, 1 stavka"
        >
          <svg
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M3 3h2l3 12h10l3-9H6" />
            <circle cx="9" cy="20" r="1" />
            <circle cx="18" cy="20" r="1" />
          </svg>
          <span class="count">1</span>
        </a>
        <a
          class="wallet"
          [routerLink]="base + '/wallet'"
          routerLinkActive="active"
          aria-label="Novčanik, stanje 120 EC"
        >
          ◎ 120 EC
        </a>
        <details class="user-menu">
          <summary><span class="avatar" aria-hidden="true">M</span> marko</summary>
          <div class="user-menu__list">
            <a [routerLink]="base + '/preferences'">Preference tura</a>
            <a [routerLink]="base + '/gift-cards'">Poklon kartice</a>
            <hr />
            <a routerLink="/design-preview/prototype">Odjava</a>
          </div>
        </details>
      </div>
    </nav>

    <!-- Only while a tour is in progress; the whole strip leads to the active tour and hides on it. -->
    <a class="run-strip" [routerLink]="base + '/active-tour'" routerLinkActive="run-strip--here">
      <span class="run-strip__dot" aria-hidden="true"></span>
      <span><strong>Tura u toku:</strong> Kej i Liman biciklom · 1 od 3 tačke</span>
      <span class="run-strip__action">Nastavi →</span>
    </a>
  </header>

  <main class="proto-main">
    <router-outlet />
  </main>
</div>
