<ul class="lines">
  @for (item of items(); track item.id) {
    <li class="line">
      <h3>
        <!-- The product is a tour; its page belongs to Exploration and is reached by its address. -->
        <a [routerLink]="['/exploration/tours', item.entityId]">{{ item.name }}</a>
      </h3>
      <div class="line__price">
        <span class="line__amount">{{ item.price === 0 ? 'Besplatno' : item.price + ' EC' }}</span>
        @if (removable()) {
          <button
            class="quiet"
            type="button"
            [disabled]="pending()"
            [attr.aria-label]="'Ukloni ' + item.name + ' iz korpe'"
            (click)="removeItem.emit(item.id)"
          >
            Ukloni
          </button>
        }
      </div>
    </li>
  }
</ul>
